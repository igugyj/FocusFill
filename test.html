<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFill 测试页</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1f2328;
            --muted: #656d76;
            --border: #d0d7de;
            --accent: #007aff;
            --input-bg: #ffffff;
            --focus-shadow: rgba(0, 122, 255, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --fg: #e6edf3;
                --muted: #8b949e;
                --border: #30363d;
                --accent: #0a84ff;
                --input-bg: #0d1117;
                --focus-shadow: rgba(10, 132, 255, 0.25);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 20px 80px;
            color: var(--fg);
            background: var(--bg);
            line-height: 1.6;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 6px;
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        fieldset {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 18px;
        }

        legend {
            font-weight: 600;
            padding: 0 8px;
        }

        .row {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 10px 16px;
            align-items: center;
            margin-bottom: 12px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        label {
            font-size: 14px;
            color: var(--muted);
            text-align: right;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--fg);
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--focus-shadow);
        }

        textarea {
            min-height: 64px;
            resize: vertical;
        }

        .note {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .note kbd {
            background: var(--border);
            color: var(--fg);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 12px;
            font-family: ui-monospace, monospace;
        }
    </style>
</head>

<body>
    <h1>FocusFill 测试页</h1>
    <p class="sub">点击输入框，命中规则时右侧会出现小圆点；<kbd>Ctrl+Enter</kbd> 填充，<kbd>Alt+Z</kbd> 撤销。</p>

    <div class="note">
        如果某个字段没有出现小圆点：检查设置页里对应规则的 <code>value</code> 是否为空，以及 <code>keywords</code> / <code>aliases</code> 是否覆盖到了这里的字段名。
    </div>

    <form onsubmit="event.preventDefault();">
        <fieldset>
            <legend>属性驱动（name / id）</legend>
            <div class="row">
                <label for="t-name">姓名</label>
                <input type="text" id="t-name" name="name">
            </div>
            <div class="row">
                <label for="t-phone">电话</label>
                <input type="tel" id="t-phone" name="phone">
            </div>
            <div class="row">
                <label for="t-email">邮箱</label>
                <input type="email" id="t-email" name="email">
            </div>
            <div class="row">
                <label for="t-company">公司</label>
                <input type="text" id="t-company" name="company">
            </div>
        </fieldset>

        <fieldset>
            <legend>autocomplete 标准属性</legend>
            <div class="row">
                <label for="t-given">名</label>
                <input type="text" id="t-given" autocomplete="given-name">
            </div>
            <div class="row">
                <label for="t-tel">手机</label>
                <input type="tel" id="t-tel" autocomplete="tel">
            </div>
            <div class="row">
                <label for="t-org">单位</label>
                <input type="text" id="t-org" autocomplete="organization">
            </div>
        </fieldset>

        <fieldset>
            <legend>label[for] 驱动</legend>
            <div class="row">
                <label for="t-label-name">真实姓名</label>
                <input type="text" id="t-label-name">
            </div>
            <div class="row">
                <label for="t-label-address">详细地址</label>
                <textarea id="t-label-address" rows="2"></textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>placeholder 驱动</legend>
            <div class="row">
                <label>占位</label>
                <input type="text" placeholder="请输入邮箱">
            </div>
            <div class="row">
                <label>占位</label>
                <input type="text" placeholder="请输入手机号">
            </div>
        </fieldset>

        <fieldset>
            <legend>select 值匹配</legend>
            <div class="row">
                <label for="t-title">职位</label>
                <select id="t-title" name="title">
                    <option value="">请选择</option>
                    <option value="fe">前端工程师</option>
                    <option value="be">后端工程师</option>
                    <option value="pm">产品经理</option>
                </select>
            </div>
        </fieldset>
    </form>
</body>

</html>
